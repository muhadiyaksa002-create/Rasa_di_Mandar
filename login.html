<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | Rasa di Mandar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-laut sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Rasa di Mandar</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#menuUtama"
              aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="daftar.html">Kuliner</a></li>
          <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="btn btn-fajar ms-lg-3" href="login.html">Masuk</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ISI HALAMAN: kotak login dua panel -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">

        <div class="kotak-login">
          <div class="row g-0">

            <!-- Panel kiri: sambutan (disembunyikan di layar kecil) -->
            <div class="col-md-5 panel-kiri d-none d-md-flex flex-column justify-content-center">
              <h2>Selamat datang kembali.</h2>
              <p class="mt-3 mb-0">Masuk untuk menyimpan kuliner khas Mandar favoritmu.</p>
            </div>

            <!-- Panel kanan: form -->
            <div class="col-md-7 p-4 p-lg-5">
              <h1 class="h3 fw-bold">Masuk</h1>
              <p class="text-muted">Isi email dan password kamu.</p>

              <!-- novalidate: matikan validasi bawaan browser agar pesan dari JavaScript kita yang tampil -->
              <form id="formLogin" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control form-control-lg" id="email" placeholder="nama@email.com">
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control form-control-lg" id="password" placeholder="Minimal 8 karakter">
                </div>

                <!-- Tempat pesan validasi muncul -->
                <div id="pesan"></div>

                <button type="submit" class="btn btn-fajar btn-lg w-100">Masuk</button>
              </form>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-laut text-white-50 py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between">
      <span>Rasa di Mandar &copy; 2026.</span>
      <span>Kuliner khas Mandar, Sulawesi Barat</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script validasi kita, dimuat setelah form ada -->
  <script src="js/login.js"></script>
</body>
</html>
